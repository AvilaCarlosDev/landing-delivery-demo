version: 2
updates:
  # Dependabot mensual, agrupado en un solo PR y sin majors (evita ruido de alertas)
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      all: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
